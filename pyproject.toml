[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-trade"
version = "0.1.0"
description = "Reproducible forensic analysis of a headerless trading-history export"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
  "ruptures>=1.1.9,<2",
  "hmmlearn>=0.3.3,<1",
]

[project.scripts]
reverse-trade = "reverse_trade.pipeline:main"
reverse-trade-reconstruction = "reverse_trade.reconstruction.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
